name: Build and Deploy to One.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS files
        run: git lfs pull

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Write deploy marker
        run: echo "${{ github.sha }}" > dist/deploy-version.txt

      # Upload til websitets rod: One.com-login lander i brugerens hjemmemappe,
      # mens sitet serveres fra webroots/<site>. Mappen findes automatisk
      # (eller sættes manuelt med repo-variablen DEPLOY_PATH).
      - name: Deploy to One.com via SFTP
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USERNAME }}
          PORT: ${{ secrets.SFTP_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sshpass >/dev/null
          sftp_run() { sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=no -P "$PORT" -b "$1" "$USER@$HOST"; }

          if [ -n "${DEPLOY_PATH:-}" ]; then
            TARGET="$DEPLOY_PATH"
          else
            printf 'ls -1 webroots/\n' > ls.txt
            mapfile -t ENTRIES < <(sftp_run ls.txt | grep -v '^sftp>' | sed 's#/*$##' | grep -v '^$')
            echo "Fundet under webroots/: ${ENTRIES[*]:-<ingen>}"
            if [ "${#ENTRIES[@]}" -ne 1 ]; then
              echo "::error::Forventede præcis én mappe under webroots/. Sæt repo-variablen DEPLOY_PATH (fx webroots/<mappe>)."
              exit 1
            fi
            TARGET="${ENTRIES[0]}"
            case "$TARGET" in webroots/*) ;; *) TARGET="webroots/$TARGET" ;; esac
          fi
          echo "Uploader til: $TARGET"

          printf 'cd %s\nlcd dist\nput -r .\nls -la\n' "$TARGET" > put.txt
          sftp_run put.txt

      # Fejl hvis live-sitet ikke viser den nye version
      - name: Verify live site
        run: |
          for i in 1 2 3 4 5 6; do
            live=$(curl -fsS "https://dsklinik.dk/deploy-version.txt?t=$(date +%s)" || true)
            echo "attempt $i: live='$live' expected='${{ github.sha }}'"
            [ "$live" = "${{ github.sha }}" ] && echo "✅ Live site updated" && exit 0
            sleep 10
          done
          echo "::error::Upload fuldført, men dsklinik.dk viser ikke den nye version. SFTP lander i en mappe/server, som ikke er websitets rod."
          exit 1
